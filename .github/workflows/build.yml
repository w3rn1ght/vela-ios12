name: build-deb

on:
  push:
  workflow_dispatch:

jobs:
  deb:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Theos + ldid
        run: |
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          mkdir -p "$HOME/theos/sdks"
          curl -sL -o /tmp/theos-sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/theos-sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$HOME/theos/sdks/"

      - name: Build sing-box core
        run: |
          chmod +x scripts/build-core.sh
          ./scripts/build-core.sh

      - name: Parser tests
        run: |
          chmod +x scripts/run-parser-tests.sh
          ./scripts/run-parser-tests.sh

      - name: Build .deb
        run: make package

      - name: Inspect binaries
        run: |
          echo "--- core ---"
          file layout/usr/libexec/vela/sing-box
          vtool -show-build layout/usr/libexec/vela/sing-box || true
          echo "--- daemon ---"
          file .theos/obj/arm64/velad
          echo "--- icons ---"
          ls -1 .theos/_/Applications/Vela.app/*.png | wc -l
          for f in AppIcon60x60@2x.png AppIcon60x60@3x.png Icon-Small@2x.png Icon-72@2x.png; do
            sips -g pixelWidth -g pixelHeight ".theos/_/Applications/Vela.app/$f" 2>/dev/null | tail -2 | tr '\n' ' '
            echo " <- $f"
          done
          echo "--- icon keys ---"
          plutil -p .theos/_/Applications/Vela.app/Info.plist | grep -i -E "icon" || true
          if plutil -p .theos/_/Applications/Vela.app/Info.plist | grep -q CFBundleIconName; then
            echo "ERROR: CFBundleIconName присутствует — iOS 12 будет искать Assets.car и иконка станет пустой"
            exit 1
          fi
          echo "CFBundleIconName отсутствует: ok"
          echo "--- deb ---"
          ls -lh packages/
          dpkg-deb -I packages/*.deb 2>/dev/null || true
          dpkg-deb -c packages/*.deb 2>/dev/null | sed -n '1,40p' || true

      - uses: actions/upload-artifact@v4
        with:
          name: vela-deb
          path: packages/*.deb
          if-no-files-found: error
